<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#FFF4E6" />
  <title>Couple's Kitchen</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Baloo 2 + Nunito both include full Vietnamese diacritics -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;700;800&display=swap&subset=vietnamese" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-mode="home">
  <div id="app">

    <!-- HOME -->
    <section id="screen-home" class="screen active">
      <header class="topbar topbar-home">
        <div class="icon-btn-spacer"></div>
        <div class="topbar-title"></div>
        <button class="icon-btn lang-btn" aria-label="Language">🇬🇧</button>
      </header>
      <div class="home-hero">
        <div class="steam"><span></span><span></span><span></span></div>
        <div class="hero-pot">🍲</div>
        <h1 data-i18n-html="home.title">Couple's<br />Kitchen</h1>
        <p class="tagline" data-i18n="home.tagline">Cook together, from anywhere 💕</p>
      </div>

      <div class="card">
        <label class="field">
          <span data-i18n="home.nameLabel">Your chef name</span>
          <input id="name-input" maxlength="16" data-i18n-ph="home.namePh" placeholder="e.g. Tri" autocomplete="nickname" />
        </label>
        <button id="create-btn" class="btn btn-primary" data-i18n="home.create">🍳 Open a new kitchen</button>
        <div class="divider"><span data-i18n="home.or">or join your partner</span></div>
        <div class="join-row">
          <input id="code-input" maxlength="4" data-i18n-ph="home.codePh" placeholder="CODE" autocapitalize="characters" autocomplete="off" spellcheck="false" />
          <button id="join-btn" class="btn btn-secondary" data-i18n="home.join">Join</button>
        </div>
      </div>
    </section>

    <!-- LOBBY -->
    <section id="screen-lobby" class="screen">
      <header class="topbar">
        <button class="icon-btn" id="leave-btn" aria-label="Leave kitchen">←</button>
        <div class="topbar-title" data-i18n="lobby.title">The Kitchen</div>
        <div class="topbar-right">
          <button class="icon-btn lang-btn" aria-label="Language">🇬🇧</button>
          <button class="icon-btn mute-btn" aria-label="Toggle sound">🔊</button>
        </div>
      </header>

      <div class="fridge">
        <div class="magnet-label" data-i18n="lobby.codeLabel">Kitchen code</div>
        <div class="magnet-code" id="lobby-code">····</div>
        <button id="share-btn" class="btn btn-small" data-i18n="lobby.share">📤 Send to partner</button>
      </div>

      <div class="chefs" id="lobby-chefs"></div>
      <p class="lobby-hint" id="lobby-hint"></p>
      <div class="wallet-row">
        <div class="wallets" id="lobby-wallets"></div>
        <button class="btn btn-small btn-shop" id="shop-btn" data-i18n="lobby.shop">🛒 Shop</button>
      </div>


      <h2 class="section-title" data-i18n="lobby.modeTitle">Pick tonight's mode</h2>
      <div class="modes">
        <button class="mode-card mode-relay" data-mode="relay">
          <div class="mode-emoji">🍷</div>
          <div class="mode-text">
            <div class="mode-name"><span data-i18n="mode.relay.name">Recipe Relay</span></div>
            <div class="mode-desc" data-i18n="mode.relay.desc"></div>
          </div>
        </button>
        <button class="mode-card mode-rush" data-mode="rush">
          <div class="mode-emoji">🔥</div>
          <div class="mode-text">
            <div class="mode-name"><span data-i18n="mode.rush.name">Split Kitchen</span></div>
            <div class="mode-desc" data-i18n="mode.rush.desc"></div>
          </div>
        </button>
        <button class="mode-card mode-sneak" data-mode="sneak">
          <div class="mode-emoji">🌙</div>
          <div class="mode-text">
            <div class="mode-name"><span data-i18n="mode.sneak.name">Midnight Snack</span></div>
            <div class="mode-desc" data-i18n="mode.sneak.desc"></div>
          </div>
        </button>
      </div>

      <div class="recap" id="lobby-recap"></div>
    </section>

    <!-- RECIPE RELAY -->
    <section id="screen-relay" class="screen">
      <header class="topbar">
        <button class="icon-btn" id="relay-back" aria-label="Back to lobby">←</button>
        <div class="topbar-title" id="relay-title"></div>
        <button class="icon-btn mute-btn" aria-label="Toggle sound">🔊</button>
      </header>

      <div class="turn-banner" id="turn-banner"></div>
      <div class="turn-dots" id="turn-dots"></div>

      <div class="pot-area">
        <div class="pot-steam"><span></span><span></span><span></span></div>
        <div class="pot-contents" id="pot-contents"></div>
        <div class="pot" aria-hidden="true">
          <div class="pot-rim"></div>
          <div class="pot-body"></div>
          <div class="pot-handle left"></div>
          <div class="pot-handle right"></div>
        </div>
        <div class="last-move" id="last-move"></div>
      </div>

      <div class="secret-card" id="secret-card">
        <div class="secret-head">
          <span data-i18n="relay.secret">🔒 Your secret card</span>
          <span class="secret-tip"></span>
        </div>
        <ul id="secret-list"></ul>
      </div>

      <div class="controls">
        <div class="pantry" id="pantry"></div>
        <div class="actions" id="actions"></div>
      </div>

      <div class="reactions" id="reactions"></div>
    </section>

    <!-- SPLIT KITCHEN -->
    <section id="screen-rush" class="screen">
      <header class="topbar">
        <button class="icon-btn" id="rush-back" aria-label="Back to lobby">←</button>
        <div class="rush-status">
          <span id="rush-level"></span>
          <span class="rush-clock" id="rush-clock">0:00</span>
        </div>
        <div class="topbar-right">
          <span class="rush-coins" id="rush-coins">💰 0</span>
          <button class="icon-btn mute-btn" aria-label="Toggle sound">🔊</button>
        </div>
      </header>
      <div class="rush-timebar"><i id="rush-timebar"></i></div>
      <div class="rush-orders" id="rush-orders"></div>
      <div class="rush-body" id="rush-body"></div>
      <div class="rush-pause" id="rush-pause" hidden></div>
    </section>

    <section id="screen-rush-results" class="screen">
      <header class="topbar">
        <div class="icon-btn-spacer"></div>
        <div class="topbar-title" data-i18n="rush.resultsTitle">Kitchen closed!</div>
        <div class="icon-btn-spacer"></div>
      </header>
      <div class="results-hero">
        <div class="results-bowl" id="rr-level"></div>
        <div class="results-stars" id="rr-stars"></div>
        <h2 class="results-name" id="rr-coins"></h2>
        <p class="results-score" id="rr-goal"></p>
      </div>
      <div class="rr-stats" id="rr-stats"></div>
      <div class="results-buttons">
        <button class="btn btn-primary" id="rr-next"></button>
        <button class="btn btn-secondary" id="rr-retry" data-i18n="rush.retry">🔁 Play again</button>
        <button class="btn btn-ghost" id="rr-lobby" data-i18n="results.lobby">Back to kitchen</button>
      </div>
    </section>

    <!-- MIDNIGHT SNACK -->
    <section id="screen-sneak" class="screen">
      <header class="topbar">
        <button class="icon-btn" id="sneak-back" aria-label="Back to lobby">←</button>
        <div class="rush-status">
          <span id="sneak-night"></span>
          <span class="sneak-round" id="sneak-round"></span>
        </div>
        <button class="icon-btn mute-btn" aria-label="Toggle sound">🔊</button>
      </header>
      <div class="noise">
        <span class="noise-face" id="noise-face">😴</span>
        <div class="noise-bar"><i id="noise-fill"></i><b id="noise-preview"></b></div>
        <span class="noise-num" id="noise-num"></span>
      </div>
      <div class="sneak-recipe" id="sneak-recipe"></div>
      <div class="sneak-board-wrap"><div class="sneak-board" id="sneak-board"></div></div>
      <div class="sneak-controls">
        <div class="sneak-plan" id="sneak-plan"></div>
        <div class="sneak-buttons">
          <button class="btn btn-ghost" id="sneak-undo"></button>
          <button class="btn btn-ghost" id="sneak-wait"></button>
          <button class="btn btn-primary" id="sneak-lock"></button>
        </div>
        <div class="sneak-status" id="sneak-status"></div>
      </div>
      <div class="sneak-intro" id="sneak-intro" hidden></div>
    </section>

    <section id="screen-sneak-results" class="screen">
      <header class="topbar">
        <div class="icon-btn-spacer"></div>
        <div class="topbar-title" id="sr-title"></div>
        <div class="icon-btn-spacer"></div>
      </header>
      <div class="results-hero">
        <div class="results-bowl" id="sr-snack"></div>
        <div class="results-stars" id="sr-stars"></div>
        <h2 class="results-name" id="sr-headline"></h2>
        <p class="results-score" id="sr-rounds"></p>
      </div>
      <div class="rr-stats" id="sr-stats"></div>
      <div class="results-buttons">
        <button class="btn btn-primary" id="sr-next"></button>
        <button class="btn btn-secondary" id="sr-retry" data-i18n="sneak.retry">🔁 Try again</button>
        <button class="btn btn-ghost" id="sr-lobby" data-i18n="results.lobby">Back to kitchen</button>
      </div>
    </section>

    <!-- SHOP -->
    <section id="screen-shop" class="screen">
      <header class="topbar">
        <button class="icon-btn" id="shop-back" aria-label="Back">←</button>
        <div class="topbar-title" data-i18n="shop.title">Shop</div>
        <div class="icon-btn-spacer"></div>
      </header>
      <div class="wallets big" id="shop-wallets"></div>
      <p class="shop-earn" data-i18n="shop.howEarn"></p>
      <div class="shop-tabs">
        <button class="shop-tab" data-tab="kitchen" data-i18n="shop.tab.kitchen">🍳 Kitchen</button>
        <button class="shop-tab" data-tab="chef" data-i18n="shop.tab.chef">👩‍🍳 My chef</button>
      </div>
      <div class="shop-body" id="shop-body"></div>
    </section>

    <!-- RESULTS -->
    <section id="screen-results" class="screen">
      <header class="topbar">
        <div class="icon-btn-spacer"></div>
        <div class="topbar-title" data-i18n="results.title">Taste test!</div>
        <div class="icon-btn-spacer"></div>
      </header>
      <div class="results-hero">
        <div class="results-bowl" id="results-bowl"></div>
        <div class="results-stars" id="results-stars"></div>
        <h2 class="results-name" id="results-name"></h2>
        <p class="results-score" id="results-score"></p>
      </div>
      <div class="results-cards" id="results-cards"></div>
      <div class="results-target" id="results-target"></div>
      <p class="reward" id="results-reward"></p>
      <div class="results-buttons">
        <button class="btn btn-primary" id="next-btn" data-i18n="results.again">🍲 Cook another</button>
        <button class="btn btn-ghost" id="results-lobby-btn" data-i18n="results.lobby">Back to kitchen</button>
      </div>
    </section>
  </div>

  <div class="banner" id="conn-banner" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <div class="float-layer" id="float-layer" aria-hidden="true"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
